<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 認證練習系統 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F9F8F6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            color: #2C2C2C;
        }

        .header {
            background: linear-gradient(135deg, #3D3D3D 0%, #4A4A4A 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .mode-selector {
            background: #FEFDFB;
            padding: 20px;
            border-bottom: 2px solid #E8E6E1;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 20px;
            border: 2px solid #D4CECA;
            background: white;
            color: #3D3D3D;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            border-color: #B8956A;
            background: #FFF8F0;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #3D3D3D 0%, #4A4A4A 100%);
            color: white;
            border-color: #3D3D3D;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: #FEFDFB;
            border-bottom: 1px solid #E8E6E1;
            flex-wrap: wrap;
            justify-content: center;
            overflow-x: auto;
        }

        .tab-button {
            padding: 12px 16px;
            border: 2px solid #D4CECA;
            background: white;
            color: #3D3D3D;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
            font-size: 13px;
        }

        .tab-button:hover {
            border-color: #B8956A;
            background: #FFF8F0;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #3D3D3D 0%, #4A4A4A 100%);
            color: white;
            border-color: #3D3D3D;
        }

        .tab-info {
            font-size: 11px;
            opacity: 0.7;
            display: block;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .exam-summary {
            background: #FFF3E0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #B8956A;
            color: #3D3D3D;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 12px 16px;
            border: 1px solid #D4CECA;
            border-radius: 8px;
            background: white;
            color: #2C2C2C;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
        }

        select:hover, button:hover {
            border-color: #B8956A;
            background: #FFF8F0;
        }

        button {
            font-weight: 500;
        }

        .progress-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-item {
            background: #FEFDFB;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #E8E6E1;
            text-align: center;
            font-size: 14px;
        }

        .progress-bar {
            background: #E8E6E1;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #B8956A 0%, #D4A76A 100%);
            height: 100%;
            transition: width 0.3s;
        }

        .question-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #E8E6E1;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.8;
            margin: 20px 0;
            color: #2C2C2C;
        }

        .options {
            margin: 25px 0;
        }

        .option-item {
            padding: 16px;
            margin: 12px 0;
            border: 2px solid #E8E6E1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-item:hover {
            border-color: #B8956A;
            background: #FFF8F0;
        }

        .option-item input {
            margin-top: 3px;
        }

        .option-item.selected {
            border-color: #3D3D3D;
            background: #FFF3E0;
        }

        .option-item.correct {
            border-color: #4CAF50;
            background: #F1F8F4;
            color: #2E7D32;
        }

        .option-item.incorrect {
            border-color: #F44336;
            background: #FDF1F0;
            color: #C62828;
        }

        .answer-reveal {
            background: #F1F8F4;
            border-left: 4px solid #4CAF50;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }

        .answer-reveal.show {
            display: block;
        }

        .answer-label {
            font-weight: 600;
            color: #2E7D32;
            margin-bottom: 10px;
        }

        .explanation {
            color: #2C2C2C;
            line-height: 1.8;
            font-size: 15px;
        }

        .navigation {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .nav-btn {
            flex: 1;
            max-width: 200px;
            padding: 14px 20px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 16px;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #E8E6E1;
            border-top: 3px solid #B8956A;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .mode-selector {
                flex-direction: column;
                gap: 8px;
            }

            .mode-btn {
                width: 100%;
                text-align: center;
            }

            .tabs-container {
                gap: 5px;
                padding: 15px;
            }

            .tab-button {
                padding: 10px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }

            .question-box {
                padding: 16px;
            }

            .option-item {
                padding: 12px;
                font-size: 14px;
            }

            .nav-btn {
                max-width: none;
                padding: 12px 16px;
                font-size: 14px;
            }

            .progress-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐕 AI 認證練習系統</h1>
        <p>1500 題完整題庫 | 多種學習模式</p>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="switchMode('original')">📖 原始題庫（500 題）</button>
        <button class="mode-btn" onclick="switchMode('units')">📚 10 單元系統（1000 題）</button>
    </div>

    <div class="container">
        <!-- 原始題庫模式 -->
        <div id="originalMode" class="content active">
            <div class="tabs-container" id="originalTabs"></div>
            <div id="originalContent"></div>
        </div>

        <!-- 10 單元模式 -->
        <div id="unitsMode" class="content">
            <div class="tabs-container" id="unitsTabs"></div>
            <div id="unitsContent"></div>
        </div>
    </div>

    <script>
        // 原始題庫配置
        const originalExams = [
            { id: 'genai_100', name: '生成式 AI 100', file: 'genai_100.json', count: 100 },
            { id: 'genai_200', name: '生成式 AI 200', file: 'genai_200.json', count: 200 },
            { id: 'all_questions', name: '工程素養 200', file: 'all_questions.json', count: 200 }
        ];

        // 10 單元配置
        const units = [
            { id: 'unit1', name: '基礎概念', filter: 1, count: 60 },
            { id: 'unit2', name: '線性回歸與梯度下降', filter: 2, count: 80 },
            { id: 'unit3', name: '數據預處理與特徵工程', filter: 3, count: 60 },
            { id: 'unit4', name: '邏輯迴歸與模型評估', filter: 4, count: 40 },
            { id: 'unit5', name: '神經網路基礎與硬體', filter: 5, count: 110 },
            { id: 'unit6', name: '深度學習與計算機視覺', filter: 6, count: 200 },
            { id: 'unit7', name: '自然語言處理基礎', filter: 7, count: 120 },
            { id: 'unit8', name: 'RNN 與序列模型', filter: 8, count: 80 },
            { id: 'unit9', name: '綜合應用案例', filter: 9, count: 100 },
            { id: 'unit10', name: '進階理論與優化', filter: 10, count: 150 }
        ];

        const state = {};
        const allData = {};
        let currentMode = 'original';
        let loadingComplete = false;

        // 初始化所有狀態
        [...originalExams, ...units].forEach(item => {
            const id = item.id;
            state[id] = {
                currentIndex: 0,
                questions: [],
                shuffled: false,
                answered: {},
                correct: 0,
                loaded: false
            };
        });

        // 生成原始題庫標籤
        function generateOriginalTabs() {
            const container = document.getElementById('originalTabs');
            container.innerHTML = '';
            originalExams.forEach(exam => {
                const btn = document.createElement('button');
                btn.className = exam.id === 'genai_100' ? 'tab-button active' : 'tab-button';
                btn.onclick = () => switchOriginalExam(exam.id);
                btn.innerHTML = `${exam.name}<span class="tab-info">${exam.count}題</span>`;
                container.appendChild(btn);
            });
        }

        // 生成 10 單元標籤
        function generateUnitsTabs() {
            const container = document.getElementById('unitsTabs');
            container.innerHTML = '';
            units.forEach(unit => {
                const btn = document.createElement('button');
                btn.className = unit.id === 'unit1' ? 'tab-button active' : 'tab-button';
                btn.onclick = () => switchUnit(unit.id);
                btn.innerHTML = `${unit.name}<span class="tab-info">${unit.count}題</span>`;
                container.appendChild(btn);
            });
        }

        // 生成原始題庫內容
        function generateOriginalContent() {
            const container = document.getElementById('originalContent');
            container.innerHTML = '';
            originalExams.forEach((exam, idx) => {
                const examDiv = document.createElement('div');
                examDiv.id = exam.id;
                examDiv.className = 'content' + (idx === 0 ? ' active' : '');
                examDiv.innerHTML = `
                    <div class="exam-summary">
                        <strong>${exam.name}</strong><br>
                        共 ${exam.count} 題
                    </div>
                    <div class="controls">
                        <button onclick="shuffleQuestions('${exam.id}')">🐕 隨機</button>
                        <button onclick="resetTest('${exam.id}')">🐶 重置</button>
                    </div>
                    <div class="progress-info">
                        <div class="info-item"><div>題目：<span id="current_${exam.id}">1</span>/${exam.count}</div></div>
                        <div class="info-item"><div>正確率：<span id="accuracy_${exam.id}">0%</span></div></div>
                        <div class="info-item"><div>進度：<span id="progress_${exam.id}">0%</span></div></div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="bar_${exam.id}" style="width: 0%"></div></div>
                    <div id="questions_${exam.id}"></div>
                    <div class="navigation">
                        <button class="nav-btn" onclick="prevQuestion('${exam.id}')">⬅️ 上一題</button>
                        <button class="nav-btn" style="background: linear-gradient(135deg, #4A4A4A 0%, #3D3D3D 100%); color: white;" onclick="revealAnswer('${exam.id}')">🦴 顯示答案</button>
                        <button class="nav-btn" onclick="nextQuestion('${exam.id}')">下一題 ➡️</button>
                    </div>
                `;
                container.appendChild(examDiv);
            });
        }

        // 生成 10 單元內容
        function generateUnitsContent() {
            const container = document.getElementById('unitsContent');
            container.innerHTML = '';
            units.forEach((unit, idx) => {
                const unitDiv = document.createElement('div');
                unitDiv.id = unit.id;
                unitDiv.className = 'content' + (idx === 0 ? ' active' : '');
                unitDiv.innerHTML = `
                    <div class="exam-summary">
                        <strong>單元 ${idx + 1}：${unit.name}</strong><br>
                        共 ${unit.count} 題
                    </div>
                    <div class="controls">
                        <button onclick="shuffleQuestions('${unit.id}')">🐕 隨機</button>
                        <button onclick="resetTest('${unit.id}')">🐶 重置</button>
                    </div>
                    <div class="progress-info">
                        <div class="info-item"><div>題目：<span id="current_${unit.id}">1</span>/${unit.count}</div></div>
                        <div class="info-item"><div>正確率：<span id="accuracy_${unit.id}">0%</span></div></div>
                        <div class="info-item"><div>進度：<span id="progress_${unit.id}">0%</span></div></div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="bar_${unit.id}" style="width: 0%"></div></div>
                    <div id="questions_${unit.id}"></div>
                    <div class="navigation">
                        <button class="nav-btn" onclick="prevQuestion('${unit.id}')">⬅️ 上一題</button>
                        <button class="nav-btn" style="background: linear-gradient(135deg, #4A4A4A 0%, #3D3D3D 100%); color: white;" onclick="revealAnswer('${unit.id}')">🦴 顯示答案</button>
                        <button class="nav-btn" onclick="nextQuestion('${unit.id}')">下一題 ➡️</button>
                    </div>
                `;
                container.appendChild(unitDiv);
            });
        }

        // 切換模式
        async function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('originalMode').classList.toggle('active', mode === 'original');
            document.getElementById('unitsMode').classList.toggle('active', mode === 'units');

            if (mode === 'original') {
                switchOriginalExam('genai_100');
            } else {
                // 如果進階題庫還未載入，先等待載入
                if (!state['unit1'].loaded) {
                    console.log('進階題庫未載入，開始載入...');
                    await loadUnitsData();
                }
                switchUnit('unit1');
            }
        }

        // 載入原始題庫檔案
        async function loadOriginalExams() {
            for (const exam of originalExams) {
                try {
                    const response = await fetch(exam.file);
                    const data = await response.json();
                    state[exam.id].questions = data;
                    state[exam.id].loaded = true;
                    displayQuestion(exam.id);
                } catch (error) {
                    console.error(`載入 ${exam.file} 失敗:`, error);
                }
            }
        }

        // 延遲載入 10 單元檔案（使用 Promise 避免卡頓）
        async function loadUnitsData() {
            try {
                console.log('開始載入進階題庫...');
                const response = await fetch('advanced_questions.json');
                const unitsData = await response.json();
                console.log(`進階題庫載入成功，共 ${unitsData.length} 題`);
                
                // 分批載入單元資料
                for (const unit of units) {
                    const filtered = unitsData.filter(q => q.unit === unit.filter);
                    state[unit.id].questions = filtered;
                    state[unit.id].loaded = true;
                    console.log(`單元 ${unit.filter}（${unit.name}）：${filtered.length} 題`);
                }
                
                // 只有在切換到單元模式時才顯示第一題
                if (currentMode === 'units') {
                    displayQuestion('unit1');
                }
            } catch (error) {
                console.error('載入進階題庫失敗:', error);
            }
        }

        // 切換原始題庫
        function switchOriginalExam(examId) {
            document.querySelectorAll('#originalContent .content').forEach(c => c.classList.remove('active'));
            document.getElementById(examId).classList.add('active');
            document.querySelectorAll('#originalTabs .tab-button').forEach((btn, idx) => {
                btn.classList.toggle('active', originalExams[idx].id === examId);
            });
            window.scrollTo(0, 0);
        }

        // 切換單元
        function switchUnit(unitId) {
            document.querySelectorAll('#unitsContent .content').forEach(c => c.classList.remove('active'));
            document.getElementById(unitId).classList.add('active');
            document.querySelectorAll('#unitsTabs .tab-button').forEach((btn, idx) => {
                btn.classList.toggle('active', units[idx].id === unitId);
            });
            
            // 確保題目已載入後顯示
            const s = state[unitId];
            if (s.questions.length > 0) {
                displayQuestion(unitId);
            } else if (s.loaded) {
                console.warn(`${unitId} 已標記為載入，但題目為空`);
            }
            
            window.scrollTo(0, 0);
        }

        // 顯示題目（優化版）
        function displayQuestion(id) {
            const s = state[id];
            if (!s.questions.length) return;

            const q = s.questions[s.currentIndex];
            const container = document.getElementById('questions_' + id);
            if (!container) return;

            const isAnswered = id in s.answered;
            const isCorrect = s.answered[id]?.correct;

            let html = `<div class="question-box"><div style="color: #999;">第 ${s.currentIndex + 1} 題</div><div class="question-text">${q.text}</div><div class="options">`;

            ['A', 'B', 'C', 'D'].forEach(opt => {
                const selected = isAnswered && s.answered[id].answer === opt;
                const correct = opt === q.correct_answer;
                let className = 'option-item';
                if (selected && !isCorrect) className += ' incorrect';
                if (correct && isAnswered) className += ' correct';
                if (selected && isCorrect) className += ' correct';

                html += `<label class="${className}"><input type="radio" name="option_${id}" value="${opt}" ${selected ? 'checked' : ''} ${isAnswered ? 'disabled' : `onchange="selectAnswer('${id}', '${opt}')"`}><span><strong>${opt}.</strong> ${q.options[opt]}</span></label>`;
            });

            html += `</div></div>`;
            if (isAnswered) {
                html += `<div class="answer-reveal show"><div class="answer-label">✓ 正確答案：${q.correct_answer}</div><div class="explanation">${q.explanation}</div></div>`;
            }

            container.innerHTML = html;
            updateProgress(id);
        }

        // 選擇答案
        function selectAnswer(id, answer) {
            const s = state[id];
            const q = s.questions[s.currentIndex];
            const isCorrect = answer === q.correct_answer;

            s.answered[id] = { answer, correct: isCorrect };
            if (isCorrect) s.correct++;

            document.querySelectorAll(`input[name="option_${id}"]`).forEach(r => r.disabled = true);
            displayQuestion(id);
        }

        // 下一題
        function nextQuestion(id) {
            const s = state[id];
            if (s.currentIndex < s.questions.length - 1) {
                s.currentIndex++;
                displayQuestion(id);
                setTimeout(() => {
                    document.querySelector('.question-box')?.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            }
        }

        // 上一題
        function prevQuestion(id) {
            const s = state[id];
            if (s.currentIndex > 0) {
                s.currentIndex--;
                displayQuestion(id);
                setTimeout(() => {
                    document.querySelector('.question-box')?.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            }
        }

        // 顯示答案
        function revealAnswer(id) {
            const s = state[id];
            const q = s.questions[s.currentIndex];
            if (!(id in s.answered)) {
                s.answered[id] = { answer: q.correct_answer, correct: true };
                s.correct++;
            }
            displayQuestion(id);
        }

        // 隨機題目
        function shuffleQuestions(id) {
            const s = state[id];
            if (s.shuffled) {
                alert('已經是隨機順序');
                return;
            }
            s.questions.sort(() => Math.random() - 0.5);
            s.currentIndex = 0;
            s.answered = {};
            s.correct = 0;
            s.shuffled = true;
            displayQuestion(id);
        }

        // 重置測試
        function resetTest(id) {
            if (confirm('確定要重置此單元嗎？')) {
                state[id].currentIndex = 0;
                state[id].answered = {};
                state[id].correct = 0;
                state[id].shuffled = false;
                if (currentMode === 'original') {
                    loadOriginalExams();
                } else {
                    loadUnitsData();
                }
            }
        }

        // 更新進度
        function updateProgress(id) {
            const s = state[id];
            const total = s.questions.length;
            const answered = Object.keys(s.answered).length;
            const correct = s.correct;

            const progressPercent = total > 0 ? Math.round((answered / total) * 100) : 0;
            const accuracyPercent = answered > 0 ? Math.round((correct / answered) * 100) : 0;

            const current = document.getElementById('current_' + id);
            const progress = document.getElementById('progress_' + id);
            const accuracy = document.getElementById('accuracy_' + id);
            const bar = document.getElementById('bar_' + id);

            if (current) current.textContent = s.currentIndex + 1;
            if (progress) progress.textContent = progressPercent + '%';
            if (accuracy) accuracy.textContent = accuracyPercent + '%';
            if (bar) bar.style.width = progressPercent + '%';
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            generateOriginalTabs();
            generateOriginalContent();
            generateUnitsTabs();
            generateUnitsContent();
            
            // 立即載入原始題庫
            loadOriginalExams().then(() => {
                console.log('✅ 原始題庫已載入');
            }).catch(e => {
                console.error('❌ 原始題庫載入失敗:', e);
            });
            
            // 立即啟動進階題庫載入（無延遲，用戶可能立即切換）
            loadUnitsData().then(() => {
                console.log('✅ 10 單元題庫已載入');
            }).catch(e => {
                console.error('❌ 10 單元題庫載入失敗:', e);
            });
